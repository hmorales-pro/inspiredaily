name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly re-run so newly published advisories surface even without a push.
    - cron: "0 5 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails the build on any moderate-or-worse advisory, so regressions are
      # caught in the PR rather than as a GitHub alert weeks later.
      - name: npm audit
        run: npm audit --audit-level=moderate
